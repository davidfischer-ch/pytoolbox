# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
---
name: Python package
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        extras: ["all,test"]
        pytest-args: [""]
        # The vision extra's dependencies have no 3.14 wheels yet: that job installs every other
        # extra, and leaves the modules needing vision out of the run.
        exclude:
          - python-version: "3.14"
        include:
          - python-version: "3.14"
            extras: "all_but_vision,test"
            pytest-args: "--ignore=pytoolbox/ai"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install System dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq cmake ffmpeg screen
        sudo apt-get install -qq liblzma-dev libxml2-dev libxslt-dev libyaml-dev libz-dev
        sudo apt-get install -qq libcairo2 libcairo2-dev libexiv2-dev libgexiv2-dev libgirepository-2.0-dev
    - name: Install Python dependencies
      run: |
        pip install -U pip setuptools wheel
        pip install -U -e .[${{ matrix.extras }}]
        pip freeze
    - name: Debug env
      run: |
        env | sort | grep -i -E 'COLOR|TERM|CI'
    - name: Type check with pyrefly
      run: |
        pyrefly check
    - name: Test with pytest
      run: |
        python -m pytest -vvvv ${{ matrix.pytest-args }}
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        flag-name: python-${{ matrix.python-version }}
        parallel: true

  # Merges the coverage the jobs of the matrix sent, as one build.
  coveralls:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true

  build-windows:
    if: false
    runs-on: windows-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install System dependencies
      run: choco install ffmpeg --no-progress -y
    - name: Install Python dependencies
      run: |
        pip install -U pip setuptools wheel
        pip install -U -e .[atlassian,aws,django,django_filter,django_formtools,flask,jinja2,mongodb,network,pandas,rest_framework,selenium,voluptuous,test]
        pip freeze
    - name: Debug env
      run: |
        env | sort | grep -i -E 'COLOR|TERM|CI'
      shell: bash
    - name: Test with pytest
      run: |
        python -m pytest -vvvv --ignore=pytoolbox/ai --ignore=pytoolbox/multimedia/image --ignore=pytoolbox/network/smpte2022
...
