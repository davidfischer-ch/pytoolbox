# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

  apt_packages:
    # Core
    - liblzma-dev
    - libxml2-dev
    - libxslt-dev
    - libyaml-dev
    - libz-dev

    # For PyGObject
    # See https://pygobject.readthedocs.io/en/latest/getting_started.html#ubuntu-getting-started
    - libcairo2
    - libcairo2-dev
    - libgirepository-2.0-dev

    # For GExiv2
    - libexiv2-dev
    - libgexiv2-dev

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# The package with its extras, the vision ones left out: the docs mock them (docs/source/conf.py).
# Sphinx and its theme are bounded to their major by the doc extra.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - all_but_vision
        - doc
