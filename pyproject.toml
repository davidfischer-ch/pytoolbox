# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
# https://iscinumpy.dev/post/bound-version-constraints/

[build-system]
requires = ['setuptools>=41', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'pytoolbox'
version = '14.11.5'

authors = [
    {name = 'David Fischer', email = 'david@fisch3r.net'}
]
description = 'Toolbox for Python scripts'
keywords = [
    'celery',
    'django',
    'ffmpeg',
    'flask',
    'json',
    'juju',
    'mock',
    'pillow',
    'rsync',
    'rtp',
    'screen',
    'selenium',
    'smpte 2022-1',
    'subprocess'
]
license = {text = 'EUPL 1.1'}
readme = {file = 'README.rst', content-type = 'text/x-rst'}
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Framework :: Django',
    'Framework :: Flask',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: European Union Public Licence 1.1 (EUPL 1.1)',
    'Natural Language :: English',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Topic :: Software Development :: Libraries :: Python Modules'
]

requires-python = '>=3.11'
dependencies = [
    'python-magic-bin; sys_platform == "win32"',
    'python-magic; sys_platform != "win32"',
    'cryptography',
    'defusedxml',
    'typing_extensions; python_version < "3.12"',
    'tzdata',
    'requests',
    'ruamel.yaml',
    'setuptools',
    'termcolor'
]

[project.optional-dependencies]
atlassian = ['jira']
aws = ['boto3']
django = ['django>=6']
django_datatable_view = ['django-datatable-view']
django_filter = ['django-filter']
django_formtools = ['django-formtools']
flask = ['flask']
imaging = [
    'pillow',
    'PyGObject'
]
jinja2 = ['jinja2']
mongodb = ['pymongo']
network = ['tldextract']
pandas = [
    'ezodf',
    'lxml',
    'pandas'
]
rest_framework = [
    'django-oauth-toolkit',
    'djangorestframework>=3'
]
selenium = ['selenium']
smpte2022 = ['fastxor']
vision = [
    'dlib',
    'keras',
    'numpy',
    'opencv-python',
    'tensorflow'
]
voluptuous = ['voluptuous']
all = [
    'pytoolbox[atlassian,aws,django,django_datatable_view,django_filter,django_formtools,flask,imaging,jinja2,mongodb,network,pandas,rest_framework,selenium,smpte2022,vision,voluptuous]'
]
doc = [
    'sphinx>=7.2.6',
    'sphinx-rtd-theme>=2.0.0'
]
test = [
    'colored>=2.2.4',
    'coverage>=7.4.4',
    'pylint>=3.1.0',
    'pyrefly>=1.2.0',
    'pytest>=8.1.1,<9.0.3',
    'pytest-cov>=4.1.0',
    'pytest-pylint>=0.21.0',
    'pytest-ruff>=0.3.1',
    'ruff>=0.3.3',
    # Stubs
    'PyGObject-stubs>=2.10.0; sys_platform != "win32"',
    'django-stubs>=6.1.0',
    'djangorestframework-stubs>=3.18.1',
    'types-requests>=2.31.0.20240311',
    'types-urllib3>=1.26.25.14'
]

[project.urls]
homepage   = 'https://github.com/davidfischer-ch/pytoolbox'
repository = 'https://github.com/davidfischer-ch/pytoolbox'

[tool.setuptools.packages.find]
exclude = ['tests']

[tool.setuptools.package-data]
pytoolbox = ['py.typed']
'pytoolbox.ai.vision.face.detect' = ['data/*']
'pytoolbox.ai.vision.face.recognize' = ['data/*']

# Testing -------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = """
    --cov=pytoolbox
    --cov-fail-under=75
    --cov-report term-missing
    --cov-report html
    --cov-report xml
    --doctest-modules
    --ignore=docs/source
    --ignore=pytoolbox/django
    --ignore=pytoolbox/django_datatable_view
    --ignore=pytoolbox/django_filter
    --ignore=pytoolbox/django_formtools
    --ignore=pytoolbox/rest_framework
    --pylint
    --ruff
    --ruff-format
"""
doctest_optionflags = ['ELLIPSIS', 'NORMALIZE_WHITESPACE']

# Linters -------------------------------------------------------------------------------------------

[tool.pyrefly]
# Paths are relative to this file.
project-includes = ['pytoolbox']
project-excludes = ['**/__pycache__/**', '**/*.egg-info/**', '**/docs/build/**']

# Pyrefly checks a few things mypy never did; `legacy` turns those off so the migration does not
# start out with a fresh class of violations on top of the ones mypy already reported.
preset = 'legacy'

# There is no virtualenv in the repository, so the interpreter has to come from PATH.
fallback-python-interpreter-name = 'python3'

# dlib is a package whose whole API comes from `from _dlib_pybind11 import *`, a compiled
# extension carrying no type information, so the module resolves while every name in it does
# not. Reading it as Any is the closest a checker can get.
replace-imports-with-any = ['dlib']

# Modules that may not be installed, and that a checker could not introspect anyway: crispy_forms
# and psycopg2 are imported by the code paths needing them, psutil is a best-effort import with a
# fallback, the rest are C extensions or ship no type information. Listing the ones the vision
# extra provides keeps the check working without that extra too.
ignore-missing-imports = [
    'crispy_forms',
    'fastxor',
    'keras',
    'keras.layers',
    'keras.models',
    'psutil',
    'psycopg2.extras',
    'tensorflow'
]

[tool.pyrefly.errors]
# mypy's `disable_error_code = ['import-untyped']`. Unlike mypy, pyrefly follows untyped imports
# by default, so the per-module `follow_untyped_imports` list mypy needed is gone with it.
untyped-import = 'ignore'

# A method that overrides one of its bases says so, and the checker enforces it.
missing-override-decorator = 'error'

[tool.pylint.main]
jobs = 0
py-version = '3.11'
ignored-modules = ['gi', 'gi.repository']
load-plugins = [
    'pylint.extensions.bad_builtin',
    'pylint.extensions.broad_try_clause',
    'pylint.extensions.check_elif',
    'pylint.extensions.code_style',
    'pylint.extensions.comparison_placement',
    'pylint.extensions.consider_refactoring_into_while_condition',
    'pylint.extensions.dict_init_mutate',
    'pylint.extensions.docparams',
    'pylint.extensions.for_any_all',
    'pylint.extensions.overlapping_exceptions',
    'pylint.extensions.redefined_variable_type',
    'pylint.extensions.set_membership',
    'pylint.extensions.typing'
]

[tool.pylint.basic]
good-names          = ['_', 'df', 'f', 'i', 'j', 'k', 'Run', 's3', 'tz', 'x', 'y', 'z']
bad-names           = ['bar', 'baz', 'foo', 'tata', 'toto', 'tutu']
function-rgx        = '([a-z_][a-z0-9_]{2,40}$|test_[a-z_][a-z0-9_]{2,60}$)'
variable-rgx        = '[a-z_][a-z0-9_]{2,30}$'
const-rgx           = '(([A-Z_][A-Z0-9_]*)|(__.*__))$'
attr-rgx            = '[a-z_][a-z0-9_]{2,}$'
argument-rgx        = '[a-z_][a-z0-9_]{2,30}$'
class-attribute-rgx = '([A-Za-z_][A-Za-z0-9_]{2,30}|(__.*__))$'
class-rgx           = '[A-Z_][a-zA-Z0-9]+$'
module-rgx          = '(([a-z_][a-z0-9_]*)|([A-Z][a-zA-Z0-9]+))$'
method-rgx          = '[a-z_][a-z0-9_]{2,}$'

[tool.pylint.design]
max-args           = 9
max-locals         = 19
max-returns        = 11
max-branches       = 20
max-attributes     = 11
max-statements     = 50
max-try-statements = 7
max-positional-arguments = 12

[tool.pylint.format]
max-line-length   = 100
ignore-long-lines = '^\s*(# )?<?https?://\S+>?$'
max-module-lines  = 2000

[tool.pylint."messages control"]
enable = [
    'use-symbolic-message-instead',
    'useless-suppression'
]
disable = [
    'attribute-defined-outside-init',
    # Mixins name the class they complete as a TYPE_CHECKING-only base, which is `object` at
    # runtime; that is the point, not a leftover. pylint takes the TYPE_CHECKING branch, so it
    # also counts those bases as real ancestors.
    'too-many-ancestors',
    'useless-object-inheritance',
    'consider-using-assignment-expr',
    'cyclic-import',
    'fixme',
    'import-outside-toplevel',
    'invalid-name'
]

[tool.pylint.refactoring]
never-returning-functions = ['argparse.parse_error', 'sys.exit']

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-imports       = true
ignore-signatures    = true

[tool.pylint.spelling]
spelling-ignore-comment-directives = 'fmt: on,fmt: off,noqa:,noqa,nosec,isort:skip,pyrefly:,pragma:,# noinspection'
spelling-private-dict-file         = 'custom_dict.txt'

[tool.pylint.typecheck]
generated-members = ['REQUEST', 'acl_users', 'aq_parent', 'argparse.Namespace']

[tool.pylint.typing]
runtime-typing = false

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['D', 'E', 'F', 'I', 'N', 'UP004', 'W']
ignore = [
    'D100',  # missing docstring in public module
    'D101',  # missing docstring in public class
    'D102',  # missing docstring in public method
    'D103',  # missing docstring in public function
    'D104',  # missing docstring in public package
    'D105',  # missing docstring in magic method
    'D106',  # missing docstring in public nested class
    'D107',  # missing docstring in __init__
    'D200',  # one-line docstring should fit on one line
    'D203',  # one blank line required before class docstring (conflicts with D211)
    'D204',  # one blank line required after class docstring
    'D205',  # one blank line required between summary and description
    'D212',  # multi-line docstring summary should start at first line
    'D400',  # first line should end with a period
    'N814',  # camelcase imported as constant
    'N999'   # invalid module name
]
